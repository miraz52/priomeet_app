name: priomeet_app
description: "PrioMeet Realtime Authentic Live Dating & Video Calling App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  agora_rtc_engine: ^6.3.0
  permission_handler: ^11.3.1
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  http: ^1.2.0
  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
