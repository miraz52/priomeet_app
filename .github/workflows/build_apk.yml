name: Build PrioMeet Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Recreate Clean Android Structure
        run: |
          rm -rf android
          flutter create . --org com.priomeet --project-name priomeet_app --platforms android

      - name: Add Permissions to Official Manifest
        run: |
          # অফিশিয়াল মেনিফেস্টের ভেতর পারমিশন ইনজেক্ট করা (কোনো ফাইল ডিলিট বা রিসোর্স মিসিং ছাড়া)
          sed -i '/<application/i \
    <uses-permission android:name="android.permission.INTERNET"/>\
    <uses-permission android:name="android.permission.CAMERA"/>\
    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\
    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\
    <uses-permission android:name="android.permission.BLUETOOTH"/>\
    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\
    <uses-feature android:name="android.hardware.camera"/>\
    <uses-feature android:name="android.hardware.camera.autofocus"/>' android/app/src/main/AndroidManifest.xml

      - name: Set Min SDK for Agora
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: priomeet-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
